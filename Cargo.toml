[package]
name = "dev-bench"
version = "0.9.2"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Performance measurement and regression detection for Rust. Part of the dev-* verification suite."

keywords = [
    "benchmark",
    "performance",
    "regression",
    "verification",
    "ai-tools"
]

categories = [
    "development-tools",
    "development-tools::profiling",
    "development-tools::testing"
]

documentation = "https://docs.rs/dev-bench"
repository = "https://github.com/jamesgober/dev-bench"
homepage = "https://github.com/jamesgober/dev-bench"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dev-report = { version = "0.9", path = "../dev-report" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dhat = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
alloc-tracking = ["dep:dhat"]

[profile.release]
opt-level = 3
lto = "thin"
